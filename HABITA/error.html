
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de error del sistema HABITA">
    <title>Error | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container error-box">

        <div class="logo">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>¡Ups! Ha ocurrido un error</h2>

        <p id="mensajeError">
            Ha ocurrido un error inesperado. Revisa los datos e intenta nuevamente.
        </p>

        <div class="error-actions">
            <a href="login.html" class="btn primary">
                Volver al inicio
            </a>

            <button type="button" class="primary"
                onclick="location.href='login.html'">
                Reintentar
            </button>
        </div>

    </main>

</body>
</html>
