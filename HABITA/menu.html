
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Menú principal del sistema HABITA">
    <title>Menú principal | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <div class="logo">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>Menú principal</h2>

        <p>Bienvenido al sistema de gestión y reservación de habitaciones HABITA.</p>

        <section class="menu-grid">

            <article class="card">
                <h3>Reservas</h3>
                <p>Realiza nuevas solicitudes de reserva.</p>
                <button type="button" class="primary"
                    onclick="location.href='reservas.html'">
                    Ir a reservas
                </button>
            </article>

            <article class="card">
                <h3>Mi perfil</h3>
                <p>Consulta y actualiza tu información personal.</p>
                <button type="button" class="primary"
                    onclick="location.href='perfil.html'">
                    Ir a perfil
                </button>
            </article>

            <article class="card">
                <h3>Historial</h3>
                <p>Consulta tus reservas y sus estados.</p>
                <button type="button" class="primary"
                    onclick="location.href='historial.html'">
                    Ver historial
                </button>
            </article>

        </section>

        <a href="index.html" class="link">Volver al inicio</a>
        <a href="login.html" class="link">Cerrar sesión</a>

    </main>

</body>
</html>
