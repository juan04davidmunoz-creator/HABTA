
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de reservas HABITA">
    <title>Reservar habitación | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <div class="logo">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>Reservar habitación</h2>

        <p>Complete los datos para realizar su solicitud de reserva.</p>

        <div class="card">
            <form id="reservaForm">

                <label for="servicio">Tipo de habitación</label>
                <select id="servicio" name="servicio" required>
                    <option value="">Seleccione una habitación</option>
                    <option value="Sencilla">Habitación sencilla</option>
                    <option value="Doble">Habitación doble</option>
                    <option value="Premium">Habitación premium</option>
                </select>

                <label for="fecha">Fecha de entrada</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="hora">Hora de llegada</label>
                <input type="time" id="hora" name="hora" required>

                <button type="submit" class="primary">
                    Confirmar reserva
                </button>

            </form>
        </div>

        <a href="menu.html" class="link">Volver al menú principal</a>
        <a href="index.html" class="link">Volver al inicio</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
