
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de colores | HABITA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #EAF1F8;
            color: #0A2A43;
        }

        h1 {
            text-align: center;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 650px;
            margin-top: 30px;
        }

        .color-item {
            text-align: center;
        }

        .color {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            border: 2px solid #ddd;
            margin: auto;
        }

        .label {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Paleta de colores HABITA</h1>

    <p>Identidad visual del sistema de gestión y reservación de habitaciones.</p>

    <div class="palette">

        <div class="color-item">
            <div class="color" style="background:#0A2A43;"></div>
            <div class="label">Azul oscuro</div>
            <div>#0A2A43</div>
        </div>

        <div class="color-item">
            <div class="color" style="background:#1E90FF;"></div>
            <div class="label">Azul principal</div>
            <div>#1E90FF</div>
        </div>

        <div class="color-item">
            <div class="color" style="background:#EAF1F8;"></div>
            <div class="label">Azul claro</div>
            <div>#EAF1F8</div>
        </div>

        <div class="color-item">
            <div class="color" style="background:#F2B01E;"></div>
            <div class="label">Dorado</div>
            <div>#F2B01E</div>
        </div>

        <div class="color-item">
            <div class="color" style="background:#FFFFFF;"></div>
            <div class="label">Blanco</div>
            <div>#FFFFFF</div>
        </div>

    </div>

</body>
</html>
