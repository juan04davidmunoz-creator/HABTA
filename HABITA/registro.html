
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de usuarios de HABITA">
    <title>Registro de usuario | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <div class="logo small">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>Crear una cuenta</h2>

        <p>Complete los siguientes datos para registrarse en HABITA.</p>

        <form id="registroForm">

            <label for="nombre">Nombres</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese sus nombres"
                autocomplete="given-name"
                required
            >

            <label for="apellido">Apellidos</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Ingrese sus apellidos"
                autocomplete="family-name"
                required
            >

            <label for="cedula">Número de documento</label>
            <input
                type="text"
                id="cedula"
                name="cedula"
                placeholder="Ingrese su documento"
                inputmode="numeric"
                required
            >

            <label for="fecha">Fecha de nacimiento</label>
            <input
                type="date"
                id="fecha"
                name="fecha"
                required
            >

            <button type="submit" class="primary">
                Registrar usuario
            </button>

        </form>

        <a href="login.html" class="link">Ya tengo una cuenta</a>
        <a href="index.html" class="link">Volver al inicio</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
