
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil de usuario del sistema HABITA">
    <title>Mi perfil | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <div class="logo">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>Mi perfil</h2>
        <p>Consulta tu información personal.</p>

        <section class="card">
            <form id="perfilForm">

                <label for="nombre">Nombre completo:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="Juan David Muñoz López"
                    required
                >

                <label for="correo">Correo electrónico:</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    value="juanlopez@email.com"
                    required
                >

                <label for="contrasena">Nueva contraseña (opcional):</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Dejar en blanco para no cambiarla"
                    autocomplete="new-password"
                >

                <button type="submit" class="primary">
                    Guardar cambios
                </button>

            </form>
        </section>

        <a href="menu.html" class="link">Volver al menú</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
