
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión del sistema HABITA">
    <title>Iniciar sesión | HABITA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <div class="logo small">
            <img src="logo-habita.jpg" alt="Logo de HABITA">
        </div>

        <h2>Iniciar sesión</h2>

        <p>Bienvenido al sistema de gestión y reservación de habitaciones.</p>

        <form id="loginForm">

            <label for="usuario">Usuario o correo electrónico</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Ingrese su usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingrese su contraseña"
                autocomplete="current-password"
                required
            >

            <label>
                <input type="checkbox" id="recordar">
                Recordar mi sesión
            </label>

            <button type="submit" class="primary">
                Iniciar sesión
            </button>

        </form>

        <p class="link">
            ¿No tienes una cuenta?
            <a href="registro.html">Regístrate aquí</a>
        </p>

        <a href="index.html" class="link">Volver al inicio</a>

    </main>

    <script src="script.js"></script>
</body>
</html>
